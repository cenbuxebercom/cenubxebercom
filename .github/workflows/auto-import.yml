name: Avto-çəkmə (5 dəqiqədən bir)

# GitHub-ın `schedule` tetikləyicisi dəqiq deyil (10-17 dəqiqə gecikə bilir). Ona görə hər işləmə özü ~25 dəqiqə
# yaşayır və içində hər 5 dəqiqədən bir çəkməni çağırır; növbəti işləmə `concurrency` ilə növbəyə düşüb dərhal davam edir.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: auto-import
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Saytları hər 5 dəqiqədən bir yoxla və yeni xəbərləri çək
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::warning::CRON_SECRET GitHub Secrets-də təyin edilməyib — avto-çəkmə işləmir (KURULUM.md → 3c)"; exit 0; fi
          for i in 1 2 3 4 5; do
            start=$(date +%s)
            curl -sS -m 290 -H "Authorization: Bearer $CRON_SECRET" "https://www.cenubxeber.com/api/cron/import" -w "\nHTTP %{http_code}\n" || true
            [ "$i" -lt 5 ] || break
            elapsed=$(( $(date +%s) - start ))
            [ "$elapsed" -lt 300 ] && sleep $(( 300 - elapsed ))
          done
