name: Avto-çəkmə (5 dəqiqədən bir)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: auto-import
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Saytları yoxla və yeni xəbərləri çək
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET GitHub Secrets-də təyin edilməyib"; exit 1; fi
          curl -sS -m 290 -H "Authorization: Bearer $CRON_SECRET" "https://www.cenubxeber.com/api/cron/import" -w "\nHTTP %{http_code}\n"
